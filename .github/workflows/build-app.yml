name: Build and Package App for macOS and Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python Environment (macOS)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.5'

      - name: Install Dependencies (macOS)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macOS.txt

      - name: Build Application with PyInstaller (macOS)
        run: |
          pyinstaller --onefile --windowed main.py --clean --noconfirm --add-data "resource:resource" --add-data "resource/icons:resource/icons" --add-data "templates:templates" --add-data "config.json:." --hidden-import pkgs --name OrDraft --icon resource/icon.ico

      - name: List Dist Folder Contents (macOS)
        run: ls -l dist

      - name: Check Disk Space (macOS)
        run: df -h

      - name: Check .app Size (macOS)
        run: du -sh dist/OrDraft.app

      - name: Clean up Build Artifacts (macOS)
        run: |
          rm -rf build
          rm -rf ~/Library/Caches/PyInstaller || true

      - name: Create DMG Installer
        run: |
          hdiutil create -volname OrDraft -srcfolder dist/OrDraft.app -ov -format UDZO OrDraft.dmg

      - name: Upload macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: OrDraft.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python Environment (Windows)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.5'

      - name: Install Dependencies (Windows)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Application with PyInstaller (Windows)
        run: |
          pyinstaller OrDraft.spec

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Create NSIS Installer
        run: |
          makensis windows_installer.nsi

      - name: Clean up Build Artifacts (Windows)
        run: rmdir /s /q build

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: OrDraftInstaller.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Installer Artifact
        uses: actions/download-artifact@v3
        with:
          name: macos-installer
          path: macos_installer

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v3
        with:
          name: windows-installer
          path: windows_installer

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload macOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: macos_installer/MyApp.dmg
          asset_name: MyApp.dmg
          asset_content_type: application/x-apple-diskimage

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows_installer/MyAppInstaller.exe
          asset_name: MyAppInstaller.exe
          asset_content_type: application/vnd.microsoft.portable-executable
